<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POST /api/v1/tasks 実行トレース</title>
  <style>
    :root{--paper:#f7f5ef;--panel:#fff;--ink:#202724;--muted:#66716c;--line:#d7d9d5;--accent:#e86e43;--ok:#176b58}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:32px 0 48px}h1{margin:0;font-size:clamp(2rem,5vw,4.2rem);letter-spacing:-.045em}.lead{max-width:760px;color:var(--muted);line-height:1.75}.lab{display:grid;grid-template-columns:1.15fr .85fr;min-height:620px;margin-top:24px;border:1px solid var(--line);background:var(--panel)}.evidence{display:grid;grid-template-rows:1fr 1fr;border-right:1px solid var(--line)}.pane{position:relative;padding:22px;overflow:hidden}.pane+.pane{border-top:1px solid var(--line)}.pane h2,.detail h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.12em}.browser{border:1px solid #bfc5c1;background:#fff}.bar{height:30px;border-bottom:1px solid var(--line);background:#ecefeb}.bar:before{content:"●  ●  ●";display:block;padding:6px 10px;color:#9ba29e;font-size:10px}.app{display:grid;grid-template-columns:1fr auto;gap:8px;padding:18px}.app input{min-width:0;padding:11px;border:1px solid var(--line)}.app button{border:0;padding:0 18px;color:#fff;background:var(--ok)}.task{grid-column:1/-1;margin-top:10px;padding:10px;border-left:4px solid var(--accent);background:#fff5ef;opacity:0;transform:translateY(6px);transition:.25s}.task.show{opacity:1;transform:none}.network{margin-top:16px;border:1px solid var(--line);font:12px/1.6 ui-monospace,SFMono-Regular,monospace}.network .row{display:grid;grid-template-columns:92px 1fr;border-top:1px solid var(--line)}.network .row:first-child{border-top:0}.network b,.network span{padding:6px 8px}.network b{background:#f1f2f0}.network .active{background:#fff0e9}.terminal{height:100%;padding:14px;background:#17201d;color:#d9e8e1;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.terminal mark{padding:2px 3px;background:#e86e43;color:#fff}.detail{display:flex;flex-direction:column;padding:24px}.step{font:700 12px/1 ui-monospace,SFMono-Regular,monospace;color:var(--ok);letter-spacing:.08em}.detail h3{margin:10px 0 8px;font-size:28px}.detail p{margin:0;color:var(--muted);line-height:1.75}.code{margin:20px 0;padding:14px;border-left:4px solid var(--accent);background:#f4f4f1;font:13px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.facts{margin:0;padding:0;list-style:none}.facts li{padding:9px 0;border-bottom:1px solid var(--line)}.facts b{display:inline-block;width:86px}.controls{margin-top:auto}.rail{display:flex;gap:5px;margin-bottom:14px}.rail i{height:6px;flex:1;background:#dde0dd}.rail i.done{background:var(--ok)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{padding:11px;border:1px solid var(--line);background:#fff;cursor:pointer}.buttons .primary{border-color:var(--ok);color:#fff;background:var(--ok)}.packet{position:absolute;right:24px;top:80px;width:110px;padding:8px;border:2px solid var(--accent);background:#fff4ee;font:11px/1.4 ui-monospace,SFMono-Regular,monospace;opacity:0;transform:translateX(-20px);transition:.3s}.packet.show{opacity:1;transform:none}@media(max-width:820px){.lab{grid-template-columns:1fr}.evidence{border-right:0;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
<main class="page">
  <p class="step">LESSON 6 / EXECUTION TRACE</p>
  <h1>1回のPOSTを、4つの証拠で追う。</h1>
  <p class="lead">同じrequestがReactのコード、DevTools Network、Railsログ、画面更新にどう現れるかを比較します。「次へ」を押すと証拠が1段階ずつ増えます。</p>

  <section class="lab">
    <div class="evidence">
      <div class="pane">
        <h2>Browser + DevTools Network</h2>
        <div class="browser">
          <div class="bar"></div>
          <div class="app">
            <input value="Networkを確認する" readonly />
            <button>追加</button>
            <div id="task" class="task">Networkを確認する</div>
          </div>
        </div>
        <div class="network">
          <div class="row"><b>Method</b><span id="method">—</span></div>
          <div class="row"><b>Path</b><span id="path">—</span></div>
          <div class="row"><b>Payload</b><span id="payload">—</span></div>
          <div class="row"><b>Status</b><span id="status">—</span></div>
          <div class="row"><b>Response</b><span id="response">—</span></div>
        </div>
        <div id="packet" class="packet">{"task":{"title":"Networkを確認する"}}</div>
      </div>
      <div class="pane">
        <h2>Rails log + SQL</h2>
        <div id="terminal" class="terminal">まだrequestは送信されていません。</div>
      </div>
    </div>

    <aside class="detail">
      <div class="step" id="stepLabel"></div>
      <h3 id="title"></h3>
      <p id="description"></p>
      <div id="code" class="code"></div>
      <ul id="facts" class="facts"></ul>
      <div class="controls">
        <div id="rail" class="rail"></div>
        <div class="buttons">
          <button id="prev">戻る</button>
          <button id="next" class="primary">次へ</button>
        </div>
      </div>
    </aside>
  </section>
</main>
<script>
const steps = [
  {
    title: "submit eventが発生する",
    description: "追加ボタンを押すとformのsubmit eventが発生し、TaskForm.handleSubmitが呼ばれます。まだHTTP requestは送信されていません。",
    code: '<form onSubmit={handleSubmit}>',
    facts: [["入力", "title string"], ["呼出先", "TaskForm.handleSubmit"], ["通信", "まだなし"]],
    network: {},
    log: "まだrequestは送信されていません。"
  },
  {
    title: "Reactがrequestを組み立てる",
    description: "handleSubmitからonAdd(title)、App.handleAdd、createTaskの順に呼ばれます。createTaskがmethod、path、JSON bodyをfetchへ渡します。",
    code: 'fetch("/api/v1/tasks", {\n  method: "POST",\n  body: JSON.stringify({ task: { title } })\n});',
    facts: [["method", "POST"], ["path", "/api/v1/tasks"], ["body", "task.title"]],
    network: {method:"POST",path:"/api/v1/tasks",payload:'{"task":{"title":"Networkを確認する"}}'},
    packet: true,
    log: "request送信中。Rails側の処理は次の段階で確認します。"
  },
  {
    title: "RailsがRouteを解決して保存する",
    description: "POSTとpathの組み合わせがTasksController#createへ対応します。Task#saveが成功するとSQLiteへINSERTが実行されます。",
    code: 'resources :tasks, only: [:index, :create, :update, :destroy]\n\ndef create\n  task = Task.new(task_params)\n  task.save\nend',
    facts: [["Route", "POST /api/v1/tasks"], ["action", "TasksController#create"], ["SQL", "INSERT INTO tasks"]],
    network: {method:"POST",path:"/api/v1/tasks",payload:'{"task":{"title":"Networkを確認する"}}'},
    log: 'Started POST "/api/v1/tasks"\nProcessing by Api::V1::TasksController#create\nParameters: {"task"=>{"title"=>"Networkを確認する"}}\n<mark>INSERT INTO "tasks" ("title", "done") VALUES (?, ?)</mark>'
  },
  {
    title: "Railsが201とJSONを返す",
    description: "保存成功後、Controllerは作成したtaskをJSONに変換し、HTTP status 201 Createdと一緒に返します。",
    code: 'render json: task, status: :created',
    facts: [["status", "201 Created"], ["response", "作成したtask JSON"], ["id", "DBが採番"]],
    network: {method:"POST",path:"/api/v1/tasks",payload:'{"task":{"title":"Networkを確認する"}}',status:"201",response:'{"id":7,"title":"Networkを確認する","done":false}'},
    log: 'Started POST "/api/v1/tasks"\nProcessing by Api::V1::TasksController#create\nINSERT INTO "tasks" ...\n<mark>Completed 201 Created</mark>'
  },
  {
    title: "setTasksが次の表示を決める",
    description: "createTaskが返したobjectをApp.handleAddが受け取り、setTasksでstateへ追加します。Reactは更新後のstateから画面を再レンダーします。",
    code: 'const newTask = await createTask(title);\nsetTasks((current) => [newTask, ...current]);',
    facts: [["受取値", "newTask object"], ["state", "tasksへ先頭追加"], ["結果", "taskが画面に表示"]],
    network: {method:"POST",path:"/api/v1/tasks",payload:'{"task":{"title":"Networkを確認する"}}',status:"201",response:'{"id":7,"title":"Networkを確認する","done":false}'},
    log: 'Completed 201 Created\n\nHTTP処理は完了。以降はbrowser内のstate更新です。',
    task: true
  }
];
let index = 0;
const $ = (id) => document.getElementById(id);
function render(){
  const step=steps[index];
  $("stepLabel").textContent=`STEP ${index+1} / ${steps.length}`;
  $("title").textContent=step.title;
  $("description").textContent=step.description;
  $("code").textContent=step.code;
  $("facts").innerHTML=step.facts.map(([k,v])=>`<li><b>${k}</b>${v}</li>`).join("");
  for(const key of ["method","path","payload","status","response"]){
    const el=$(key); el.textContent=step.network[key]||"—"; el.className=step.network[key]?"active":"";
  }
  $("terminal").innerHTML=step.log;
  $("packet").classList.toggle("show",Boolean(step.packet));
  $("task").classList.toggle("show",Boolean(step.task));
  $("rail").innerHTML=steps.map((_,i)=>`<i class="${i<=index?"done":""}"></i>`).join("");
  $("prev").disabled=index===0;
  $("next").textContent=index===steps.length-1?"最初へ":"次へ";
}
$("prev").onclick=()=>{if(index>0)index--;render()};
$("next").onclick=()=>{index=index===steps.length-1?0:index+1;render()};
render();
</script>
</body>
</html>
