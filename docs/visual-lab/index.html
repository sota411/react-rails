<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Bridge Visual Lab</title>
  <style>
    :root{--ink:#20322f;--muted:#67736f;--paper:#fffdf8;--bg:#f2efe8;--line:#d4d1c8;--green:#247866;--greenSoft:#dff3ec;--orange:#ef744b;--orangeSoft:#fff0e9}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,rgba(239,116,75,.12),transparent 28rem),var(--bg)}button{font:inherit}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.eyebrow{margin:0 0 8px;color:var(--green);font:700 12px/1 monospace;letter-spacing:.16em}.header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.header h1{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(2.5rem,7vw,5.4rem);font-weight:500;letter-spacing:-.05em}.header p:last-child{max-width:570px;margin:13px 0 0;color:var(--muted);line-height:1.75}.mode{display:flex;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}.mode button{border:0;border-radius:7px;padding:9px 11px;color:var(--muted);background:transparent;cursor:pointer}.mode button.active{color:#fff;background:var(--green)}
    .lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 24px 70px rgba(45,55,51,.1)}.stage{position:relative;min-height:600px;padding:32px;background:linear-gradient(#fbfaf5 0 72%,#e6dbc9 72%)}.scene{position:relative;height:470px}.path{position:absolute;left:10%;right:8%;top:246px;height:5px;border-radius:5px;background:#c8d6d1}.path::after{content:"";position:absolute;right:-3px;top:-6px;border-left:12px solid #c8d6d1;border-top:8px solid transparent;border-bottom:8px solid transparent}.actor{position:absolute;transition:transform .35s,opacity .35s,filter .35s}.actor.dim{opacity:.35;filter:grayscale(.7)}.actor.active{transform:translateY(-9px)}.actor.active .bubble{border-color:var(--orange);box-shadow:0 0 0 7px rgba(239,116,75,.12)}.bubble{width:132px;height:132px;border:3px solid var(--green);border-radius:28px;display:grid;place-items:center;background:var(--paper);transition:.3s}.bubble svg{width:86px;height:86px}.actor strong{display:block;margin-top:11px;text-align:center;font-size:15px}.actor small{display:block;margin-top:3px;text-align:center;color:var(--muted);font-size:11px}.user{left:0;top:160px}.react{left:20%;top:110px}.http{left:40%;top:170px}.rails{left:60%;top:100px}.db{right:0;top:160px}.packet{position:absolute;z-index:5;left:25%;top:238px;width:60px;height:42px;border:3px solid var(--orange);border-radius:7px;background:var(--orangeSoft);opacity:0;transition:left .5s ease,top .5s ease,opacity .2s,transform .5s}.packet::before{content:"JSON";position:absolute;inset:0;display:grid;place-items:center;color:#a34428;font:700 11px monospace}.packet::after{content:"";position:absolute;left:7px;right:7px;top:5px;height:16px;border-bottom:2px solid #db8a6d;transform:skewY(-18deg)}.packet.show{opacity:1}.packet.s1{left:25%;top:238px}.packet.s2{left:44%;top:238px}.packet.s3{left:64%;top:238px}.packet.s4{left:84%;top:238px}.packet.return{transform:rotate(180deg)}.hand{position:absolute;left:40px;top:330px;width:90px;height:90px;opacity:0;transition:.3s}.hand.show{opacity:1;transform:translateY(-10px)}
    .caption{position:absolute;left:32px;right:32px;bottom:24px;display:flex;align-items:center;gap:16px;padding:15px 18px;border:1px solid #c8d6d1;border-radius:13px;background:rgba(255,253,248,.92)}.caption__num{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green);font-family:Georgia,serif;font-size:20px}.caption strong{display:block}.caption span{display:block;margin-top:4px;color:var(--muted);font-size:13px}
    .panel{display:flex;flex-direction:column;min-height:600px;border-left:1px solid var(--line);background:#f7f5ee}.panel__head{padding:24px 22px 16px;border-bottom:1px solid var(--line)}.panel__head h2{margin:4px 0 7px;font:500 27px Georgia,"Yu Mincho",serif}.panel__head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.code{margin:18px;border-radius:12px;overflow:hidden;background:var(--ink)}.code__bar{padding:8px 12px;color:#b9cac4;background:#314741;font:11px monospace}.code pre{min-height:126px;margin:0;padding:16px;color:#ecf5f1;font:13px/1.7 monospace;white-space:pre-wrap}.explain{margin:0 18px;padding:15px;border-left:4px solid var(--orange);border-radius:8px;background:var(--orangeSoft);font-size:13px;line-height:1.7}.question{margin:18px;padding:15px;border:1px dashed var(--green);border-radius:10px;background:var(--greenSoft)}.question strong{display:block;margin-bottom:6px}.question p{margin:0;color:#385a51;font-size:13px;line-height:1.65}.controls{margin-top:auto;padding:18px;border-top:1px solid var(--line)}.progress{display:flex;gap:5px;margin-bottom:13px}.progress i{height:5px;flex:1;border-radius:5px;background:#d9d7cf}.progress i.done{background:var(--green)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{border:1px solid #b9c3bf;border-radius:9px;padding:10px;background:var(--paper);cursor:pointer}.buttons button.primary{border-color:var(--green);color:#fff;background:var(--green)}.buttons button:disabled{opacity:.4;cursor:not-allowed}.legend{display:flex;gap:18px;margin-top:14px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--green)}.legend span:last-child i{background:var(--orange)}
    @media(max-width:900px){.header{align-items:start;flex-direction:column}.lab{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}.stage{min-height:560px;padding:18px}.scene{transform:scale(.8);transform-origin:left top;width:125%}.caption{left:18px;right:18px}.actor small{display:none}}
  </style>
</head>
<body>
<main class="page">
  <header class="header">
    <div><p class="eyebrow">INTERACTIVE DATA JOURNEY</p><h1>追加ボタンの、その先へ。</h1><p>「次へ」を押すたびに、データが実際のコード経路を移動します。比喩モードに切り替えると、同じ流れをレストランとして見られます。</p></div>
    <div class="mode" aria-label="表示モード"><button id="realMode" class="active">実際の名前</button><button id="storyMode">レストラン比喩</button></div>
  </header>

  <section class="lab">
    <div class="stage">
      <div class="scene" aria-live="polite">
        <div class="path"></div>
        <div class="actor user" data-actor="user"><div class="bubble"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="26" r="17" fill="#efc5aa"/><path d="M31 24q19-28 38 0" fill="#20322f"/><path d="M22 90q7-45 28-45t28 45" fill="#247866"/><rect x="57" y="48" width="32" height="26" rx="5" fill="#fff0e9" stroke="#ef744b" stroke-width="3"/></svg></div><strong data-real="ユーザー" data-story="お客さん">ユーザー</strong><small data-real="入力して押す" data-story="注文を決める">入力して押す</small></div>
        <div class="actor react" data-actor="react"><div class="bubble"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="13" width="76" height="58" rx="7" fill="#edf5f2" stroke="#20322f" stroke-width="3"/><rect x="22" y="28" width="50" height="10" rx="3" fill="#c8d6d1"/><rect x="22" y="46" width="35" height="15" rx="4" fill="#ef744b"/><path d="M38 83h24" stroke="#20322f" stroke-width="4" stroke-linecap="round"/></svg></div><strong data-real="React" data-story="注文端末">React</strong><small data-real="eventとstate" data-story="注文票を作る">eventとstate</small></div>
        <div class="actor http" data-actor="http"><div class="bubble"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M13 29h74v46H13z" fill="#fff0e9" stroke="#20322f" stroke-width="3"/><path d="M14 31l36 27 36-27" fill="none" stroke="#ef744b" stroke-width="4"/><path d="M29 18h42" stroke="#247866" stroke-width="5" stroke-linecap="round"/><path d="M64 10l10 8-10 8" fill="none" stroke="#247866" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><strong data-real="HTTP" data-story="店員">HTTP</strong><small data-real="POST + JSON" data-story="注文票を運ぶ">POST + JSON</small></div>
        <div class="actor rails" data-actor="rails"><div class="bubble"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M16 77V35l18-13 17 13 18-13 15 13v42z" fill="#e4ece8" stroke="#20322f" stroke-width="3"/><circle cx="50" cy="56" r="18" fill="#fffdf8" stroke="#247866" stroke-width="4"/><path d="M50 39v34M33 56h34" stroke="#247866" stroke-width="4"/></svg></div><strong data-real="Rails" data-story="厨房">Rails</strong><small data-real="Route→Controller→Model" data-story="注文を調理へ回す">Route→Controller→Model</small></div>
        <div class="actor db" data-actor="db"><div class="bubble"><svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="23" rx="31" ry="13" fill="#dfe7e3" stroke="#20322f" stroke-width="3"/><path d="M19 23v48c0 7 14 13 31 13s31-6 31-13V23" fill="#edf5f2" stroke="#20322f" stroke-width="3"/><ellipse cx="50" cy="71" rx="31" ry="13" fill="#dfe7e3" stroke="#20322f" stroke-width="3"/><path d="M25 47c8 8 42 8 50 0" fill="none" stroke="#247866" stroke-width="3"/></svg></div><strong data-real="Database" data-story="食材庫">Database</strong><small data-real="tasks表へ保存" data-story="棚へしまう">tasks表へ保存</small></div>
        <div id="packet" class="packet"></div>
        <svg id="hand" class="hand" viewBox="0 0 100 100" aria-hidden="true"><path d="M40 82c-13-16-19-30-13-34 5-4 11 3 17 10V20c0-7 11-7 11 0v27-34c0-7 11-7 11 0v34-27c0-7 11-7 11 0v31-19c0-7 11-7 11 0v27c0 21-14 32-32 32-7 0-12-3-16-9z" fill="#efc5aa" stroke="#20322f" stroke-width="3"/></svg>
      </div>
      <div class="caption"><div id="captionNumber" class="caption__num">1</div><div><strong id="captionTitle"></strong><span id="captionText"></span></div></div>
    </div>

    <aside class="panel">
      <div class="panel__head"><p class="eyebrow">CURRENT STEP</p><h2 id="panelTitle"></h2><p id="panelLead"></p></div>
      <div class="code"><div id="codeFile" class="code__bar"></div><pre id="codeText"></pre></div>
      <div id="explain" class="explain"></div>
      <div class="question"><strong>止まって考える</strong><p id="questionText"></p></div>
      <div class="controls"><div id="progress" class="progress"></div><div class="buttons"><button id="prev">← 戻る</button><button id="next" class="primary">次へ →</button><button id="reset">最初から</button><button id="play">自動再生</button></div></div>
    </aside>
  </section>
  <div class="legend"><span><i></i>今通っている場所</span><span><i></i>運ばれているJSON</span></div>
</main>
<script>
const realSteps=[
 {actor:"user",title:"入力して追加を押す",lead:"処理の出発点はユーザー操作です。",file:"ブラウザ画面",code:'入力: 「Networkを見る」\n操作: ［＋ 追加］をクリック',explain:"まだRailsもDBも動いていません。まず、どの操作を入口にするかを確定します。",question:"クリックした直後、最初に動くのはRailsとReactのどちらでしょう？",caption:"ユーザーの操作がevent（操作の知らせ）になります。",packet:"",hand:true},
 {actor:"react",title:"Reactが入力を受け取る",lead:"onSubmitがhandleSubmitを呼びます。",file:"frontend/src/components/TaskForm.jsx",code:'<form onSubmit={handleSubmit}>\n\nasync function handleSubmit(event) {\n  event.preventDefault();\n  await onAdd(title);\n}',explain:"Reactは入力欄のstateからtitleを取り出し、親からpropsで渡されたonAddへ渡します。",question:"event.preventDefault() を消すと、formは本来どんな動きをするでしょう？",caption:"入力文字を、追加処理へ渡せる形にします。",packet:"s1"},
 {actor:"http",title:"fetchがJSONを送る",lead:"ブラウザからRailsへHTTPリクエストを出します。",file:"frontend/src/api/tasks.js",code:'fetch("/api/v1/tasks", {\n  method: "POST",\n  body: JSON.stringify({\n    task: { title }\n  })\n})',explain:"methodは依頼の種類、pathは届け先、bodyは荷物です。Networkタブではこの3つを確認します。",question:"一覧取得ならmethodはPOSTではなく何になるでしょう？",caption:"POST /api/v1/tasks とJSONがRailsへ向かいます。",packet:"s2"},
 {actor:"rails",title:"Railsが受付して保存を頼む",lead:"RouteがControllerを選び、Modelが保存します。",file:"backend/app/controllers/api/v1/tasks_controller.rb",code:'def create\n  task = Task.new(task_params)\n\n  if task.save\n    render json: task, status: :created\n  end\nend',explain:"Routeは住所録、Controllerは受付、Modelはデータのルール担当です。task.saveでDBへの保存が始まります。",question:"titleが空で保存できない場合、成功側と失敗側のどちらへ進むでしょう？",caption:"Route → Controller#create → Task Modelの順に進みます。",packet:"s3"},
 {actor:"db",title:"DBのtasks表へ保存する",lead:"データはページを再読み込みしても残る場所へ入ります。",file:"backend/db/schema.rb",code:'create_table "tasks" do |t|\n  t.string "title", null: false\n  t.boolean "done", default: false\nend',explain:"stateはブラウザを閉じると消えますが、DBへ保存したデータは残ります。列の名前と型はschemaで確認できます。",question:"doneに値を送らなかった場合、defaultにより何が保存されるでしょう？",caption:"新しい1行がtasks表へ追加されます。",packet:"s4"},
 {actor:"rails",title:"Railsが201とJSONを返す",lead:"保存されたtaskを、ブラウザへ返します。",file:"Rails response",code:'HTTP/1.1 201 Created\n\n{\n  "id": 4,\n  "title": "Networkを見る",\n  "done": false\n}',explain:"201は「新しいデータを作成できた」という結果番号です。返事にはDBが付けたidも含まれます。",question:"存在しないURLへ送ったときに多い結果番号は404・422・500のどれでしょう？",caption:"返り道では、保存結果のJSONを運びます。",packet:"s3 return"},
 {actor:"http",title:"fetchが返事を受け取る",lead:"response.json() がJSONをJavaScriptの値へ戻します。",file:"frontend/src/api/tasks.js",code:'const response = await fetch(...);\nconst newTask = await response.json();\nreturn newTask;',explain:"awaitは返事が来るまで、この処理の続きだけを待つ印です。ブラウザ全体が固まるわけではありません。",question:"response.ok がfalseなら、画面側は成功として扱うべきでしょうか？",caption:"JSONがReactの追加処理へ戻ります。",packet:"s2 return"},
 {actor:"react",title:"stateを更新して画面を描き直す",lead:"返ってきたtaskを新しい配列へ加えます。",file:"frontend/src/App.jsx",code:'setTasks((currentTasks) => [\n  newTask,\n  ...currentTasks\n]);',explain:"既存配列へ直接pushせず、新しい配列を作ります。Reactはstateが変わったと分かり、JSXをもう一度計算します。",question:"DB保存だけ成功してsetTasksを呼ばなかった場合、再読み込み前の画面には何が起きるでしょう？",caption:"保存済みtaskが画面に現れ、一往復が完了します。",packet:"s1 return"}
];
const story=["注文を決めて呼び出す","注文端末が注文票を作る","店員が注文票を厨房へ運ぶ","厨房が内容を読み、食材庫へ頼む","食材庫の棚へ記録をしまう","厨房が完成した伝票を返す","店員が返事を客席へ運ぶ","注文端末が新しい伝票を画面に並べる"];
let index=0,mode="real",timer=null;
const $=id=>document.getElementById(id);
function render(){const s=realSteps[index];document.querySelectorAll('.actor').forEach(a=>{a.classList.toggle('active',a.dataset.actor===s.actor);a.classList.toggle('dim',a.dataset.actor!==s.actor)});document.querySelectorAll('[data-real]').forEach(el=>el.textContent=el.dataset[mode]);$('packet').className='packet'+(s.packet?' show '+s.packet:'');$('hand').classList.toggle('show',!!s.hand);$('captionNumber').textContent=index+1;$('captionTitle').textContent=mode==='real'?s.title:story[index];$('captionText').textContent=s.caption;$('panelTitle').textContent=mode==='real'?s.title:story[index];$('panelLead').textContent=s.lead;$('codeFile').textContent=s.file;$('codeText').textContent=s.code;$('explain').textContent=s.explain;$('questionText').textContent=s.question;$('prev').disabled=index===0;$('next').textContent=index===realSteps.length-1?'完了 ✓':'次へ →';$('progress').innerHTML=realSteps.map((_,i)=>`<i class="${i<=index?'done':''}"></i>`).join('')}
$('next').onclick=()=>{if(index<realSteps.length-1){index++;render()}else{alert('一往復を追えました。次はDevToolsのNetworkで、実際のPOSTを見つけてください。')}};$('prev').onclick=()=>{if(index>0){index--;render()}};$('reset').onclick=()=>{clearInterval(timer);timer=null;$('play').textContent='自動再生';index=0;render()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='自動再生';return}$('play').textContent='停止';timer=setInterval(()=>{if(index===realSteps.length-1){clearInterval(timer);timer=null;$('play').textContent='自動再生'}else{index++;render()}},1800)};$('realMode').onclick=()=>{mode='real';$('realMode').classList.add('active');$('storyMode').classList.remove('active');render()};$('storyMode').onclick=()=>{mode='story';$('storyMode').classList.add('active');$('realMode').classList.remove('active');render()};render();
</script>
</body>
</html>
