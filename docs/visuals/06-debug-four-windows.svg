<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">バグ調査で見る4つの窓</title><desc id="desc">画面、Console、Network、Railsログを順番に見る探偵の机</desc>
  <style>.bg{fill:#f5f1e8}.ink{fill:#20322f}.muted{fill:#66736f}.paper{fill:#fffdf8}.green{fill:#2b7a68}.orange{fill:#ef744b}.title{font-family:Georgia,"Yu Mincho",serif;font-size:42px;fill:#20322f}.label{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:19px;font-weight:750;fill:#20322f}.small{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:13px;fill:#66736f}.mono{font-family:monospace;font-size:12px;fill:#20322f}.screen{fill:#fffdf8;stroke:#20322f;stroke-width:3}.beam{fill:#fff0c9;opacity:.6}.route{fill:none;stroke:#2b7a68;stroke-width:5;stroke-dasharray:8 7}</style>
  <defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2b7a68"/></marker></defs>
  <rect width="1200" height="700" class="bg"/><text x="50" y="58" class="title">直感で直さず、証拠の窓を左から見る</text>
  <path d="M50 595H1150L1080 690H120z" fill="#d8c3a4" stroke="#8f7655" stroke-width="3"/>
  <path d="M80 120L370 605H150z" class="beam"/>
  <!-- detective -->
  <g transform="translate(30 385)"><circle cx="92" cy="65" r="42" fill="#efc5aa"/><path d="M48 58q44-70 88 0" fill="#20322f"/><path d="M45 190q47-100 94 0" class="green"/><circle cx="124" cy="72" r="29" fill="none" stroke="#20322f" stroke-width="6"/><path d="M145 94l32 36" stroke="#20322f" stroke-width="8" stroke-linecap="round"/><text x="30" y="230" class="label">調査する人</text><text x="30" y="252" class="small">仮説より先に観察</text></g>
  <!-- four monitors -->
  <g transform="translate(230 140)"><rect width="205" height="200" rx="12" class="screen"/><rect width="205" height="32" rx="12" fill="#dfe7e3"/><text x="15" y="22" class="label" font-size="15">1 画面</text><rect x="25" y="58" width="155" height="72" rx="8" fill="#edf3f0"/><rect x="40" y="75" width="85" height="13" rx="3" fill="#c2ccc8"/><rect x="40" y="99" width="60" height="22" rx="5" class="orange"/><text x="20" y="165" class="small">何を押した？</text><text x="20" y="184" class="small">何が起きなかった？</text><path d="M86 200v34h32v22H54" fill="none" stroke="#20322f" stroke-width="5"/></g>
  <g transform="translate(470 140)"><rect width="205" height="200" rx="12" fill="#20322f" stroke="#20322f" stroke-width="3"/><rect width="205" height="32" rx="12" fill="#314741"/><text x="15" y="22" font-family="system-ui" font-size="15" font-weight="700" fill="#fff">2 Console</text><text x="16" y="67" font-family="monospace" font-size="12" fill="#ffb89f">TypeError:</text><text x="16" y="88" font-family="monospace" font-size="12" fill="#fff">tasks.map is</text><text x="16" y="107" font-family="monospace" font-size="12" fill="#fff">not a function</text><text x="16" y="152" font-family="system-ui" font-size="13" fill="#cbd8d3">JSは途中で止まった？</text><path d="M86 200v34h32v22H54" fill="none" stroke="#20322f" stroke-width="5"/></g>
  <g transform="translate(710 140)"><rect width="205" height="200" rx="12" class="screen"/><rect width="205" height="32" rx="12" fill="#dfe7e3"/><text x="15" y="22" class="label" font-size="15">3 Network</text><rect x="14" y="55" width="177" height="43" rx="6" fill="#fff0e9" stroke="#ef744b"/><text x="24" y="73" class="mono">POST tasks</text><text x="24" y="91" class="mono" fill="#ef744b">422</text><text x="16" y="137" class="small">URL / method / status</text><text x="16" y="160" class="small">送信値 / 返事</text><path d="M86 200v34h32v22H54" fill="none" stroke="#20322f" stroke-width="5"/></g>
  <g transform="translate(950 140)"><rect width="205" height="200" rx="12" fill="#20322f" stroke="#20322f" stroke-width="3"/><rect width="205" height="32" rx="12" fill="#314741"/><text x="15" y="22" font-family="system-ui" font-size="15" font-weight="700" fill="#fff">4 Rails log</text><text x="14" y="65" font-family="monospace" font-size="11" fill="#dff3ec">Processing#create</text><text x="14" y="91" font-family="monospace" font-size="11" fill="#fff">Parameters: ...</text><text x="14" y="117" font-family="monospace" font-size="11" fill="#ffb89f">Completed 422</text><text x="14" y="157" font-family="system-ui" font-size="13" fill="#cbd8d3">どの処理まで届いた？</text><path d="M86 200v34h32v22H54" fill="none" stroke="#20322f" stroke-width="5"/></g>
  <path d="M435 245H465M675 245H705M915 245H945" class="route" marker-end="url(#arr)"/>
  <g transform="translate(300 475)"><rect width="720" height="85" rx="13" class="paper" stroke="#2b7a68" stroke-width="3"/><text x="24" y="31" class="label">切り分けの言い方</text><text x="24" y="59" class="small">「クリック処理は動いた。POSTはRailsへ届いた。422なので保存ルールで拒否された可能性が高い」</text></g>
</svg>
