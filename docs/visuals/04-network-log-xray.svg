<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">ブラウザのNetworkとRailsログの対応</title><desc id="desc">同じPOST通信がNetworkとRailsログでどう見えるかを示す</desc>
  <style>.bg{fill:#f5f1e8}.ink{fill:#20322f}.muted{fill:#66736f}.paper{fill:#fffdf8}.green{fill:#2b7a68}.orange{fill:#ef744b}.title{font-family:Georgia,"Yu Mincho",serif;font-size:42px;fill:#20322f}.label{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:20px;font-weight:750;fill:#20322f}.small{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:14px;fill:#66736f}.mono{font-family:monospace;font-size:14px;fill:#20322f}.window{fill:#fffdf8;stroke:#20322f;stroke-width:3}.highlight{fill:#fff0e9;stroke:#ef744b;stroke-width:3}.link{fill:none;stroke:#ef744b;stroke-width:4;stroke-dasharray:8 7}</style>
  <defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ef744b"/></marker></defs>
  <rect width="1200" height="660" class="bg"/><text x="50" y="58" class="title">通信を透視する2つの窓</text>
  <g transform="translate(45 115)"><rect width="530" height="455" rx="14" class="window"/><rect width="530" height="42" rx="14" fill="#dfe7e3"/><circle cx="22" cy="21" r="6" fill="#ef744b"/><circle cx="42" cy="21" r="6" fill="#d7b84e"/><circle cx="62" cy="21" r="6" fill="#2b7a68"/><text x="90" y="27" class="label" font-size="16">Browser DevTools — Network</text><rect x="18" y="62" width="494" height="54" rx="8" fill="#edf3f0"/><text x="32" y="84" class="mono">Name</text><text x="198" y="84" class="mono">Method</text><text x="302" y="84" class="mono">Status</text><text x="402" y="84" class="mono">Time</text><rect x="18" y="119" width="494" height="58" rx="8" class="highlight"/><text x="32" y="153" class="mono">tasks</text><text x="198" y="153" class="mono">POST</text><text x="302" y="153" class="mono" fill="#2b7a68">201</text><text x="402" y="153" class="mono">43 ms</text><text x="24" y="220" class="label">Request Payload</text><rect x="24" y="238" width="482" height="67" rx="8" fill="#f2efe8"/><text x="38" y="265" class="mono">{ "task": { "title": "Networkを見る" } }</text><text x="24" y="344" class="label">Response</text><rect x="24" y="362" width="482" height="67" rx="8" fill="#edf8f3"/><text x="38" y="389" class="mono">{ "id": 4, "title": "Networkを見る",</text><text x="54" y="413" class="mono">"done": false }</text></g>
  <g transform="translate(625 115)"><rect width="530" height="455" rx="14" fill="#20322f" stroke="#20322f" stroke-width="3"/><rect width="530" height="42" rx="14" fill="#314741"/><text x="22" y="27" font-family="system-ui" font-size="16" font-weight="700" fill="#fffdf8">Rails terminal — log</text><text x="22" y="85" font-family="monospace" font-size="14" fill="#dff3ec">Started POST "/api/v1/tasks"</text><text x="22" y="117" font-family="monospace" font-size="14" fill="#fffdf8">Processing by Api::V1::TasksController#create</text><rect x="15" y="137" width="500" height="74" rx="7" fill="#493a32" stroke="#ef744b" stroke-width="2"/><text x="26" y="165" font-family="monospace" font-size="14" fill="#ffd8c9">Parameters: {"task"=&gt;{"title"=&gt;</text><text x="42" y="190" font-family="monospace" font-size="14" fill="#ffd8c9">"Networkを見る"}}</text><text x="22" y="250" font-family="monospace" font-size="14" fill="#fffdf8">Task Create INSERT INTO "tasks" ...</text><text x="22" y="292" font-family="monospace" font-size="14" fill="#8fd9c5">Completed 201 Created in 43ms</text><text x="22" y="350" font-family="system-ui" font-size="16" font-weight="700" fill="#fffdf8">ここから分かること</text><text x="22" y="382" font-family="system-ui" font-size="14" fill="#c9d6d2">✓ URLとmethodがRouteへ届いた</text><text x="22" y="408" font-family="system-ui" font-size="14" fill="#c9d6d2">✓ createが呼ばれ、DBへINSERTした</text><text x="22" y="434" font-family="system-ui" font-size="14" fill="#c9d6d2">✓ Railsは201を返した</text></g>
  <path d="M420 205 C520 175 600 175 700 205" class="link" marker-end="url(#arr)"/><path d="M420 480 C520 520 600 520 700 400" class="link" marker-end="url(#arr)"/>
