<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc">
  <title id="title">ReactとRailsの通信をレストランに見立てた図</title>
  <desc id="desc">客が注文し、店員が厨房と食材庫へつなぎ、料理が戻る流れ</desc>
  <style>.bg{fill:#f5f1e8}.ink{fill:#20322f}.muted{fill:#66736f}.paper{fill:#fffdf8}.green{fill:#2b7a68}.greenLine{stroke:#2b7a68}.orange{fill:#ef744b}.line{fill:none;stroke:#66736f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#2b7a68;stroke-width:4;stroke-dasharray:9 8}.title{font-family:Georgia,"Yu Mincho",serif;font-size:42px;fill:#20322f}.label{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:22px;font-weight:750;fill:#20322f}.small{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:14px;fill:#66736f}.mono{font-family:monospace;font-size:14px;fill:#2b7a68}.card{fill:#fffdf8;stroke:#d6d1c6;stroke-width:2}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2b7a68"/></marker></defs>
  <rect width="1300" height="680" class="bg"/>
  <text x="55" y="60" class="title">「追加」ボタンは、レストランで注文するのと同じ</text>

  <!-- customer and browser -->
  <g transform="translate(45 135)">
    <rect width="245" height="390" rx="16" class="paper" stroke="#d6d1c6" stroke-width="2"/>
    <rect x="18" y="18" width="209" height="188" rx="10" fill="#edf5f2" stroke="#9ab9ae"/>
    <circle cx="54" cy="58" r="20" fill="#efc5aa"/><path d="M34 54q20-32 40 0" fill="#20322f"/>
    <path d="M31 118q23-49 46 0v35H31z" class="green"/>
    <rect x="90" y="55" width="117" height="78" rx="8" class="paper" stroke="#20322f"/>
    <rect x="102" y="69" width="94" height="12" rx="4" fill="#d7dedb"/>
    <rect x="102" y="92" width="62" height="26" rx="6" class="orange"/>
    <text x="133" y="110" text-anchor="middle" font-family="system-ui" font-size="13" fill="#fff">追加</text>
    <text x="20" y="245" class="label">お客さん</text><text x="20" y="271" class="small">Reactの画面</text>
    <text x="20" y="316" class="mono">onSubmit</text><text x="20" y="340" class="small">注文内容をまとめる</text>
  </g>

  <!-- waiter / HTTP -->
  <g transform="translate(345 145)">
    <circle cx="105" cy="65" r="31" fill="#efc5aa"/><path d="M74 60q31-43 62 0" fill="#20322f"/>
    <path d="M62 190q10-89 43-89t43 89" class="paper" stroke="#20322f" stroke-width="3"/>
    <path d="M105 101v90M64 146h82" class="line"/>
    <rect x="133" y="111" width="72" height="94" rx="3" class="paper" stroke="#2b7a68" stroke-width="2" transform="rotate(8 169 158)"/>
    <line x1="146" y1="135" x2="189" y2="141" class="greenLine" stroke-width="3"/><line x1="143" y1="151" x2="186" y2="157" class="greenLine" stroke-width="3"/>
    <text x="25" y="250" class="label">店員</text><text x="25" y="276" class="small">fetch / HTTP</text>
    <text x="25" y="321" class="mono">POST /api/v1/tasks</text><text x="25" y="345" class="small">注文票を運ぶ</text>
  </g>

  <!-- kitchen / controller -->
  <g transform="translate(620 130)">
    <rect width="300" height="395" rx="16" class="paper" stroke="#d6d1c6" stroke-width="2"/>
    <path d="M35 95h230v165H35z" fill="#e9ece8" stroke="#20322f" stroke-width="2"/>
    <path d="M60 176h180v62H60z" fill="#cfd8d4"/>
    <circle cx="112" cy="144" r="37" fill="#efc5aa"/><path d="M74 138q38-55 76 0" fill="#20322f"/>
    <path d="M70 119q42-55 84 0" class="paper" stroke="#20322f" stroke-width="2"/>
    <path d="M82 235q30-61 60 0" class="green"/>
    <circle cx="196" cy="202" r="40" class="paper" stroke="#ef744b" stroke-width="4"/><path d="M167 202h58" stroke="#ef744b" stroke-width="5"/>
    <text x="24" y="300" class="label">厨房</text><text x="24" y="326" class="small">Route → Controller</text>
    <text x="24" y="365" class="mono">TasksController#create</text><text x="24" y="387" class="small">注文を読み、保存を依頼</text>
  </g>

  <!-- pantry / DB -->
  <g transform="translate(1000 145)">
    <rect x="10" y="20" width="230" height="210" rx="10" fill="#e6eee9" stroke="#20322f" stroke-width="2"/>
    <path d="M25 87h200M25 154h200" class="line"/>
    <g fill="#ef744b"><circle cx="60" cy="55" r="18"/><circle cx="105" cy="55" r="18"/><circle cx="150" cy="55" r="18"/></g>
    <g fill="#2b7a68"><rect x="45" y="108" width="42" height="30" rx="5"/><rect x="102" y="108" width="42" height="30" rx="5"/><rect x="159" y="108" width="42" height="30" rx="5"/></g>
    <g class="paper" stroke="#66736f"><path d="M43 182h50l-8 32H51z"/><path d="M103 182h50l-8 32h-34z"/><path d="M163 182h50l-8 32h-34z"/></g>
    <text x="10" y="276" class="label">食材庫</text><text x="10" y="302" class="small">Model → Database</text>
    <text x="10" y="347" class="mono">task.save</text><text x="10" y="371" class="small">ルール確認後に棚へ保存</text>
  </g>

  <path d="M285 240H345" class="dash" marker-end="url(#arrow)"/><path d="M540 240H615" class="dash" marker-end="url(#arrow)"/><path d="M920 240H994" class="dash" marker-end="url(#arrow)"/>
  <path d="M995 475H930Q870 475 870 540H330Q270 540 270 480" class="dash" marker-end="url(#arrow)"/>
  <rect x="515" y="520" width="290" height="66" rx="10" class="card"/><text x="535" y="546" class="mono">201 Created + JSON</text><text x="535" y="568" class="small">料理ではなく、保存結果が画面へ戻る</text>
</svg>
