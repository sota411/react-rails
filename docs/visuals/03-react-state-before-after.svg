<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Reactのstateが変わる前と後</title><desc id="desc">stateというメモの内容が変わると画面が描き直される様子</desc>
  <style>.bg{fill:#f5f1e8}.ink{fill:#20322f}.muted{fill:#66736f}.paper{fill:#fffdf8}.green{fill:#2b7a68}.orange{fill:#ef744b}.title{font-family:Georgia,"Yu Mincho",serif;font-size:42px;fill:#20322f}.label{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:20px;font-weight:750;fill:#20322f}.small{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:14px;fill:#66736f}.mono{font-family:monospace;font-size:15px;fill:#20322f}.phone{fill:#fffdf8;stroke:#20322f;stroke-width:4}.card{fill:#f8faf8;stroke:#cbd5d1;stroke-width:2}.arrow{fill:none;stroke:#ef744b;stroke-width:7;stroke-linecap:round}</style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ef744b"/></marker></defs>
  <rect width="1100" height="650" class="bg"/>
  <text x="55" y="60" class="title">stateは「画面専用のメモ」</text>
  <g transform="translate(65 115)"><text x="120" y="0" class="label" text-anchor="middle">クリック前</text><rect x="0" y="25" width="240" height="430" rx="32" class="phone"/><rect x="20" y="66" width="200" height="345" rx="12" fill="#edf3f0"/><rect x="39" y="92" width="162" height="60" rx="10" class="card"/><circle cx="65" cy="122" r="13" fill="#fff" stroke="#9aa7a2" stroke-width="2"/><text x="88" y="127" class="small">Networkを見る</text><rect x="39" y="169" width="162" height="38" rx="8" fill="#dfe6e3"/><text x="52" y="194" class="small">filter = "all"</text><circle cx="120" cy="434" r="11" fill="none" stroke="#20322f" stroke-width="2"/></g>
  <g transform="translate(795 115)"><text x="120" y="0" class="label" text-anchor="middle">クリック後</text><rect x="0" y="25" width="240" height="430" rx="32" class="phone"/><rect x="20" y="66" width="200" height="345" rx="12" fill="#edf3f0"/><rect x="39" y="92" width="162" height="60" rx="10" class="card"/><circle cx="65" cy="122" r="13" class="green"/><path d="M58 122l5 5 10-13" fill="none" stroke="#fff" stroke-width="3"/><text x="88" y="127" class="small" text-decoration="line-through">Networkを見る</text><rect x="39" y="169" width="162" height="38" rx="8" fill="#dff3ec"/><text x="52" y="194" class="small">done = true</text><circle cx="120" cy="434" r="11" fill="none" stroke="#20322f" stroke-width="2"/></g>

  <g transform="translate(390 160)"><path d="M0 0h320v250H0z" fill="#fff9cc" stroke="#d9c766" stroke-width="3" transform="rotate(-2 160 125)"/><circle cx="35" cy="28" r="8" class="orange"/><text x="34" y="68" class="small">Reactが覚えているメモ</text><text x="34" y="108" class="mono">tasks = [</text><text x="50" y="138" class="mono">{ title: "Networkを見る",</text><text x="67" y="168" class="mono">done: false }</text><text x="34" y="198" class="mono">]</text><path d="M170 215v45" class="arrow" marker-end="url(#arr)"/><text x="34" y="295" class="label">setTasks(...) を呼ぶ</text><text x="34" y="322" class="small">新しいメモを渡すと、Reactが画面を作り直す</text></g>
  <path d="M310 335H380" class="arrow" marker-end="url(#arr)"/><path d="M715 335H785" class="arrow" marker-end="url(#arr)"/>
  <rect x="310" y="565" width="480" height="48" rx="10" fill="#20322f"/><text x="550" y="595" text-anchor="middle" font-family="system-ui," fill="#fffdf8" font-size="17">DOMを直接塗り替えるのではなく、stateから次の画面を計算する</text>
</svg>
