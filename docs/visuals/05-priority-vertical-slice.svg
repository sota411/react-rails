<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
  <title id="title">priority機能をReactからDBまで縦に通す図</title><desc id="desc">一本のオレンジ色の糸が画面、通信、受付、モデル、DBを貫く</desc>
  <style>.bg{fill:#f5f1e8}.ink{fill:#20322f}.muted{fill:#66736f}.paper{fill:#fffdf8}.green{fill:#2b7a68}.orange{fill:#ef744b}.title{font-family:Georgia,"Yu Mincho",serif;font-size:42px;fill:#20322f}.label{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:19px;font-weight:750;fill:#20322f}.small{font-family:system-ui,"Noto Sans JP",sans-serif;font-size:14px;fill:#66736f}.mono{font-family:monospace;font-size:14px;fill:#20322f}.layer{fill:#fffdf8;stroke:#cfd5d1;stroke-width:2}.thread{fill:none;stroke:#ef744b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.pin{fill:#fff0e9;stroke:#ef744b;stroke-width:4}</style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ef744b"/></marker></defs>
  <rect width="1180" height="690" class="bg"/><text x="52" y="58" class="title">新機能は「1ファイル」ではなく、縦に貫く</text><text x="52" y="88" class="small">priority（優先度）という1本の糸を、保存から表示まで切らずにつなぐ</text>
  <path d="M160 165H1010" stroke="#d3d8d5" stroke-width="2"/><path d="M160 260H1010M160 355H1010M160 450H1010M160 545H1010" stroke="#d3d8d5" stroke-width="2"/>
  <g transform="translate(90 120)"><rect width="185" height="90" rx="12" class="layer"/><path d="M22 20h140v50H22z" fill="#edf3f0" stroke="#2b7a68"/><rect x="35" y="34" width="62" height="22" rx="4" fill="#fff" stroke="#9db2aa"/><rect x="108" y="34" width="40" height="22" rx="4" class="orange"/><text x="92" y="118" class="label" text-anchor="middle">React画面</text><text x="92" y="139" class="small" text-anchor="middle">選択肢を見せる</text></g>
  <g transform="translate(315 215)"><rect width="185" height="90" rx="45" class="layer"/><text x="92" y="43" class="mono" text-anchor="middle">JSON</text><text x="92" y="66" class="mono" text-anchor="middle">priority: "high"</text><text x="92" y="118" class="label" text-anchor="middle">HTTP通信</text><text x="92" y="139" class="small" text-anchor="middle">値を運ぶ</text></g>
  <g transform="translate(540 310)"><rect width="185" height="90" rx="12" class="layer"/><path d="M20 20h145v50H20z" fill="#20322f"/><text x="32" y="44" font-family="monospace" font-size="12" fill="#dff3ec">permit(:title,</text><text x="32" y="61" font-family="monospace" font-size="12" fill="#ffd3c4">:priority)</text><text x="92" y="118" class="label" text-anchor="middle">Controller</text><text x="92" y="139" class="small" text-anchor="middle">受け取りを許可</text></g>
  <g transform="translate(765 405)"><rect width="185" height="90" rx="12" class="layer"/><circle cx="52" cy="45" r="24" fill="#dff3ec" stroke="#2b7a68"/><path d="M43 45l7 7 13-17" fill="none" stroke="#2b7a68" stroke-width="4"/><text x="88" y="40" class="mono">inclusion:</text><text x="88" y="61" class="mono">low..high</text><text x="92" y="118" class="label" text-anchor="middle">Model</text><text x="92" y="139" class="small" text-anchor="middle">値のルール</text></g>
  <g transform="translate(945 500)"><ellipse cx="75" cy="25" rx="70" ry="22" fill="#dfe7e3" stroke="#20322f" stroke-width="2"/><path d="M5 25v48c0 12 31 22 70 22s70-10 70-22V25" fill="#edf3f0" stroke="#20322f" stroke-width="2"/><ellipse cx="75" cy="73" rx="70" ry="22" fill="#dfe7e3" stroke="#20322f" stroke-width="2"/><text x="75" y="56" class="mono" text-anchor="middle">priority列</text><text x="75" y="126" class="label" text-anchor="middle">Database</text><text x="75" y="147" class="small" text-anchor="middle">消えずに保存</text></g>
  <path d="M180 166 C315 166 260 260 405 260 S500 355 632 355 S720 450 857 450 S915 545 1015 545" class="thread" marker-end="url(#arr)"/>
  <g><circle cx="180" cy="166" r="15" class="pin"/><circle cx="405" cy="260" r="15" class="pin"/><circle cx="632" cy="355" r="15" class="pin"/><circle cx="857" cy="450" r="15" class="pin"/><circle cx="1015" cy="545" r="15" class="pin"/></g>
  <rect x="78" y="620" width="1020" height="45" rx="10" fill="#20322f"/><text x="588" y="648" text-anchor="middle" font-family="system-ui," fill="#fffdf8" font-size="17">どこか1か所で糸が切れると「選べるのに保存されない」「保存されるのに表示されない」が起きる</text>
</svg>
