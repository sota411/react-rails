services:
  backend:
    build: ./backend
    working_dir: /app
    command: bash -lc "bundle install && bin/rails db:prepare && bin/rails db:seed && bin/rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
      - bundle-cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development

  frontend:
    build: ./frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

volumes:
  bundle-cache:
  frontend-node-modules:
