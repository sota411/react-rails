name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  course-structure:
    name: 教材の構造とクイズ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-structure.mjs
      - run: node scripts/bug-lab.mjs --list
      - run: node scripts/progress.mjs

  frontend:
    name: React test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  backend:
    name: Rails test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
      - run: bundle install
      - run: bin/rails db:prepare
        env:
          RAILS_ENV: test
      - run: bin/rails test
        env:
          RAILS_ENV: test
